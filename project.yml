name: KillSwitch
options:
  bundleIdPrefix: com.lesha19
  # the app speaks Russian; its strings live in App/Localizable.xcstrings
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YR58655PJ7
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "0.10"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  KillSwitch:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Helper
        type: folder
        buildPhase: resources
      # XcodeGen has no target-level `resources:` key: the catalog must be listed as a source,
      # otherwise it is silently dropped and the app ships without its icon.
      - Assets.xcassets
    dependencies:
      - target: KillSwitchWidget
      - target: KillSwitchFilter
      - package: Yams
      - package: Sparkle
    info:
      # Merged with the generated Info.plist. Sparkle 2: appcast from the public releases repo,
      # EdDSA public key (private key: login keychain of the release Mac), daily background checks.
      path: App/Info.plist
      properties:
        SUFeedURL: https://github.com/lesha19/KillSwitch-releases/releases/latest/download/appcast.xml
        SUPublicEDKey: c9ZEz2ibLJRVCYpynZHOd4UQ5t3u9uWKh7bVULDOD0E=  # gitleaks:allow (public key)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # killswitch://home, killswitch://settings/vpn …: only open a section of the window (ADR 0008)
        CFBundleURLTypes:
          - CFBundleURLName: com.lesha19.KillSwitch
            CFBundleURLSchemes: [killswitch]
    entitlements:
      path: App/KillSwitch.entitlements
      properties:
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: KillSwitch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # CoreWLAN gives the Wi-Fi name only with Location access (trusted networks of auto-connect)
        INFOPLIST_KEY_NSLocationUsageDescription: KillSwitch узнаёт имя сети Wi-Fi, чтобы не подключать VPN в доверенных сетях. Местоположение не используется и никуда не отправляется.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: KillSwitch узнаёт имя сети Wi-Fi, чтобы не подключать VPN в доверенных сетях. Местоположение не используется и никуда не отправляется.
  KillSwitchWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/KillSwitchWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: KillSwitch
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Widget
        GENERATE_INFOPLIST_FILE: NO
  KillSwitchFilter:
    type: system-extension
    platform: macOS
    # AddressMatch, ExpiringCache: the filter's logic, in App/Core so the unit tests reach it
    sources: [Filter, App/Core/AddressMatch.swift, App/Core/ExpiringCache.swift]
    entitlements:
      path: Filter/KillSwitchFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
        com.apple.developer.networking.networkextension: [content-filter-provider]
    info:
      path: Filter/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSSystemExtensionUsageDescription: KillSwitch blocks internet access outside the VPN tunnel.
        NetworkExtension:
          NEMachServiceName: YR58655PJ7.killswitch.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Filter
        # sysextd looks the extension up by file name: it must be <bundle id>.systemextension
        PRODUCT_NAME: com.lesha19.KillSwitch.Filter
        PRODUCT_MODULE_NAME: KillSwitchFilter
        GENERATE_INFOPLIST_FILE: NO
  KillSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - App/Core
      - Shared
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KillSwitch:
    build:
      targets:
        KillSwitch: all
    test:
      targets: [KillSwitchTests]
