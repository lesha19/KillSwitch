name: KillSwitch
options:
  bundleIdPrefix: com.lesha19
  # the app speaks Russian; its strings live in App/Localizable.xcstrings
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YR58655PJ7
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "0.17.0"
    CURRENT_PROJECT_VERSION: "23"
    # on for every target (ADR 0010): the root daemon trusts the app by its signature, so no other
    # process may inject code into it; release.sh signs with --options runtime as well
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  KillSwitch:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Helper
        type: folder
        buildPhase: resources
      # the privileged daemon's launchd plist (ADR 0010), registered with SMAppService.daemon
      - path: HelperDaemon/LaunchDaemons/com.lesha19.KillSwitch.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # XcodeGen has no target-level `resources:` key: the catalog must be listed as a source,
      # otherwise it is silently dropped and the app ships without its icon.
      - Assets.xcassets
    dependencies:
      - target: KillSwitchWidget
      - target: KillSwitchFilter
      # Contents/MacOS/KillSwitchHelper, the plist's BundleProgram
      - target: KillSwitchHelper
        copy:
          destination: executables
      - package: Yams
      - package: Sparkle
    info:
      # Merged with the generated Info.plist. Sparkle 2: appcast from the public releases repo,
      # EdDSA public key (private key: login keychain of the release Mac), daily background checks.
      path: App/Info.plist
      properties:
        SUFeedURL: https://github.com/lesha19/KillSwitch-releases/releases/latest/download/appcast.xml
        SUPublicEDKey: c9ZEz2ibLJRVCYpynZHOd4UQ5t3u9uWKh7bVULDOD0E=  # gitleaks:allow (public key)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # «Обновлять автоматически», on by default (ADR 0012): downloaded in the background and
        # installed while the app is not in use; the VPN lives in the root daemons, not in the app
        SUAutomaticallyUpdate: true
        # killswitch://home, killswitch://settings/vpn …: only open a section of the window (ADR 0008)
        CFBundleURLTypes:
          - CFBundleURLName: com.lesha19.KillSwitch
            CFBundleURLSchemes: [killswitch]
    entitlements:
      path: App/KillSwitch.entitlements
      properties:
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider]
        # the Wi-Fi name for trusted networks: with the hardened runtime location needs this
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: KillSwitch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # CoreWLAN gives the Wi-Fi name only with Location access (trusted networks of auto-connect)
        INFOPLIST_KEY_NSLocationUsageDescription: KillSwitch узнаёт имя сети Wi-Fi, чтобы не подключать VPN в доверенных сетях. Местоположение не используется и никуда не отправляется.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: KillSwitch узнаёт имя сети Wi-Fi, чтобы не подключать VPN в доверенных сетях. Местоположение не используется и никуда не отправляется.
  KillSwitchWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/KillSwitchWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: KillSwitch
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Widget
        GENERATE_INFOPLIST_FILE: NO
  KillSwitchFilter:
    type: system-extension
    platform: macOS
    # AddressMatch, ExpiringCache: the filter's logic, in App/Core so the unit tests reach it
    sources: [Filter, App/Core/AddressMatch.swift, App/Core/ExpiringCache.swift]
    entitlements:
      path: Filter/KillSwitchFilter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [YR58655PJ7.killswitch]
        com.apple.developer.networking.networkextension: [content-filter-provider]
    info:
      path: Filter/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSSystemExtensionUsageDescription: KillSwitch blocks internet access outside the VPN tunnel.
        NetworkExtension:
          NEMachServiceName: YR58655PJ7.killswitch.filter
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Filter
        # sysextd looks the extension up by file name: it must be <bundle id>.systemextension
        PRODUCT_NAME: com.lesha19.KillSwitch.Filter
        PRODUCT_MODULE_NAME: KillSwitchFilter
        GENERATE_INFOPLIST_FILE: NO
  KillSwitchHelper:
    # The root daemon of ADR 0010: XPC for the app, runs /Library/KillSwitch/ks and the bundled
    # install.sh/uninstall.sh. No dependencies; only the shared, tested parts of App/Core.
    type: tool
    platform: macOS
    sources:
      - path: HelperDaemon
        excludes: [LaunchDaemons]
      - App/Core/HelperCommand.swift
      - App/Core/CoreChoice.swift
      - App/Core/HelperProtocol.swift
      - App/Core/HelperRight.swift
      - App/Core/BundleSignature.swift
      - App/Core/HelperVersion.swift
      - App/Core/HelperUpgrade.swift
      - App/Core/DaemonExecutable.swift
      - App/Core/PrivateDirectory.swift
    settings:
      base:
        PRODUCT_NAME: KillSwitchHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.helper
        # the identifier codesign gives the tool comes from its embedded Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  KillSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - App/Core
      - Shared
    dependencies:
      - package: Yams
      # The tests compile App/Core themselves; a few `@testable import KillSwitch` for the rest of
      # the app's module, so the app has to be built first (a fresh DerivedData failed with
      # "Unable to find module dependency"). Not hosted: running the tests must not start the app.
      - target: KillSwitch
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lesha19.KillSwitch.Tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KillSwitch:
    build:
      targets:
        KillSwitch: all
    test:
      targets: [KillSwitchTests]
